name: Import Wordle screenshots

# Every three hours: copy new screenshots from the shared iCloud album, update the list of answers,
# and read the letters off new screenshots so the journal can show them as a grid.
# Run it now from the Actions tab: Import Wordle screenshots > Run workflow.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordle
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch new screenshots
        run: node scripts/import-wordle.mjs

      - name: Update Wordle answers
        run: node scripts/wordle-answers.mjs

      - name: Read the letters off new screenshots
        run: |
          pip install --quiet pillow numpy
          python scripts/read-wordle.py

      - name: Save them
        run: |
          git add public/wordle public/data/wordle.json public/data/wordle-answers.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "Wordle importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Wordle screenshots and answers"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
